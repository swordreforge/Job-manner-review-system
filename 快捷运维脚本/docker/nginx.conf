resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/v1/ {
        set $backend http://career-api:8088;
        proxy_pass $backend/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health {
        set $backend http://career-api:8088;
        proxy_pass $backend/api/v1/health;
        proxy_set_header Host $host;
    }

    location /admin/ {
        set $backend http://teacher-api:8081;
        proxy_pass $backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /voice/ {
        set $backend http://voice-api:8000;
        proxy_pass $backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>职业规划系统</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:50px auto;padding:20px">
<h1>职业规划系统服务已启动</h1>
<ul>
<li><b>主服务 API</b>: /api/v1/</li>
<li><b>管理后台</b>: /admin/</li>
<li><b>语音服务</b>: /voice/</li>
</ul>
</body></html>';
    }
}
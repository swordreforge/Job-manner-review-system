[package]
name = "teacher-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
dotenv = "0.15"
validator = { version = "0.18", features = ["derive"] }
async-trait = "0.1"
rpassword = "7.3"
rust-embed = "8.5"
mime_guess = "2.0"
jsonwebtoken = "9.3"
bcrypt = "0.15"
futures-util = "0.3"

[dev-dependencies]
serial_test = "3.1"
fake = { version = "2.9", features = ["uuid", "chrono"] }

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: career-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456zj
      MYSQL_DATABASE: career_db
      MYSQL_USER: career
      MYSQL_PASSWORD: career123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - career-dev-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: career-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes
    networks:
      - career-dev-network

  # Whisper 语音识别服务
  whisper:
    build:
      context: ./whisper-20250625
      dockerfile: Dockerfile
    container_name: career-whisper-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=base
      - PYTHONUNBUFFERED=1
    volumes:
      - whisper-dev-cache:/root/.cache/whisper
      - ./whisper-20250625:/app  # 开发模式挂载源码
    networks:
      - career-dev-network

  # 后端 API 服务（开发模式）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-backend-dev
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "9091:9091"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./img:/root/img
      - ./etc:/root/etc
      - ./internal:/app/internal  # 开发模式挂载源码
    depends_on:
      - mysql
      - redis
    networks:
      - career-dev-network

volumes:
  mysql-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  whisper-dev-cache:
    driver: local

networks:
  career-dev-network:
    driver: bridge
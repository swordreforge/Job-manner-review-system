Name: career-api
Host: 0.0.0.0
Port: 8088
Mode: dev
Timeout: 120000
Log:
    ServiceName: career-api
    Mode: console
    Level: info
    KeepDays: 7
    Encoding: plain
Mysql:
    DataSource: env://MYSQL_DATASOURCE
    MaxOpenConns: 100
    MaxIdleConns: 10
    ConnMaxLifetime: 3600
Redis:
    Host: localhost:6379
    Type: node
    Pass: env://REDIS_PASSWORD
    DB: 0
    PoolSize: 100
CacheRedis:
    Host: localhost:6379
    Pass: env://REDIS_PASSWORD
    DB: 1
    PoolSize: 50
Auth:
    AccessSecret: env://JWT_SECRET
    AccessExpire: 86400
AI:
    Provider: deepseek
    ApiKey: env://AI_API_KEY
    Model: deepseek-chat
    BaseURL: https://api.deepseek.com/v1
    Timeout: 60
Prometheus:
    Host: 0.0.0.0
    Port: 9091
CORS:
    Origins:
        - http://localhost:3000
        - http://localhost:5173
        - http://localhost:8080
        - https://stu.swordreforge.top
        - https://swordreforge.top
    Methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    Headers:
        - Content-Type
        - Authorization
        - X-Requested-With
        - Accept
        - Cache-Control
RateLimit:
    TokensPerSecond: 100
    Burst: 200
CircuitBreaker:
    ForceOpen: false
    SleepWindow: 5000
    ErrorPercentThreshold: 50
Avatar:
    SavePath: "./img"
    BaseURL: "http://localhost:8088/img"
    MaxFileSize: 5242880 # 5MB

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456zj
      MYSQL_DATABASE: career_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: high-school-worker-base:latest

  career-api:
    image: high-school-worker-base:latest
    container_name: career-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./etc/career-api.yaml:/app/etc/career-api.yaml
      - ./img:/app/img
      - ./career-api:/usr/local/bin/elf
      - ./start-career.sh:/start.sh
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "/start.sh"]

  whisper:
    image: high-school-worker-base:latest
    container_name: whisper
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./whisper-20250625/target/release/xunfei-asr-server:/usr/local/bin/xunfei-asr-server
    command: ["xunfei-asr-server"]

  frontend:
    image: node:20-alpine
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./high-school-worker-design-forend/dist:/app/dist
    working_dir: /app
    command: ["npx", "serve", "-s", "dist", "-l", "3000"]

  ateacher:
    image: high-school-worker-base:latest
    container_name: ateacher
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./teacher-app/target/release/teacher-api:/usr/local/bin/teacher-api
    depends_on:
      mysql:
        condition: service_healthy
    command: ["teacher-api", "--mysql-host", "mysql", "--mysql-password", "123456zj", "--host", "0.0.0.0", "--port", "8081"]

volumes:
  mysql_data:

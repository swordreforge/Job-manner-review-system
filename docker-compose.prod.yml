version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: career-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456zj}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-career_db}
      MYSQL_USER: ${MYSQL_USER:-career}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-prod-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb_buffer_pool_size=2G
    networks:
      - career-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: career-redis-prod
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-prod-data:/data
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    networks:
      - career-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Whisper 语音识别服务
  whisper:
    build:
      context: ./whisper-20250625
      dockerfile: Dockerfile
    image: career-whisper:latest
    container_name: career-whisper-prod
    restart: always
    ports:
      - "${WHISPER_PORT:-8000}:8000"
    environment:
      - MODEL_NAME=${WHISPER_MODEL:-small}
      - PYTHONUNBUFFERED=1
    volumes:
      - whisper-prod-cache:/root/.cache/whisper
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - career-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-backend:latest
    container_name: career-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8088}:8088"
      - "${PROMETHEUS_PORT:-9091}:9091"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./img:/root/img
      - ./etc:/root/etc
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    networks:
      - career-prod-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  frontend:
    build:
      context: ./high-school-worker-design-forend
      dockerfile: Dockerfile
    image: career-frontend:latest
    container_name: career-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      whisper:
        condition: service_healthy
    networks:
      - career-prod-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: career-nginx-prod
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - career-prod-network

volumes:
  mysql-prod-data:
    driver: local
  redis-prod-data:
    driver: local
  whisper-prod-cache:
    driver: local

networks:
  career-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16